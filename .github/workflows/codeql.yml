name: CodeQL

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    # Weekly scan: Mondays at 07:17 UTC.
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize Tweedle grammar submodule
        run: git submodule update --init tweedle-lang

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build (Maven)
        run: >-
          mvn --settings .github/maven/jogamp-ci-settings.xml -U
          -DskipTests -Dcheckstyle.skip
          -Dlicense.skipAggregateDownloadLicenses=true
          -Dinstall4j.skip -Djava.awt.headless=true -q install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          category: /language:java-kotlin
