name: CodeQL

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    # Weekly scan: Mondays at 07:17 UTC.
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize Tweedle grammar submodule
        run: git submodule update --init tweedle-lang

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build (Maven)
        run: >-
          JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          mvn -DskipTests -Dcheckstyle.skip
          -Dlicense.skipAggregateDownloadLicenses=true
          -Dinstall4j.skip -Djava.awt.headless=true -q install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
