name: Alice Checkstyle CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: alice-checkstyle-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Maven version
        run: mvn -v

      - name: Run Checkstyle with Maven
        run: mvn checkstyle:check -Dcheckstyle.config.location=checkstyle.xml
