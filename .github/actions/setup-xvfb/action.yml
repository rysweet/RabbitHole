name: Setup Xvfb
description: Install Ubuntu Xvfb tooling and expose an absolute xvfb-run path.

outputs:
  xvfb-run:
    description: Absolute path to xvfb-run.
    value: ${{ steps.resolve-xvfb.outputs.xvfb-run }}

runs:
  using: composite
  steps:
    # Reproducibility note (issue #984):
    # These packages come from the official Ubuntu archive and are GPG-signed
    # by the distro, so their integrity is already verified by apt. We keep the
    # package list explicit and use --no-install-recommends to minimize the
    # install surface. Exact apt version pinning is intentionally NOT used: the
    # Ubuntu archive only retains the latest point releases, so pinned versions
    # age out and break CI on GitHub-hosted runners. The residual risk of an
    # unpinned (but signed) install is an accepted trade-off for CI stability.
    - name: Install Xvfb
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb

    - name: Resolve xvfb-run
      id: resolve-xvfb
      shell: bash
      run: |
        set -euo pipefail
        xvfb_run="$(command -v xvfb-run)"
        case "${xvfb_run}" in
          /*) ;;
          *)
            printf 'xvfb-run resolved to non-absolute path: %s\n' "${xvfb_run}" >&2
            exit 1
            ;;
        esac
        printf 'xvfb-run=%s\n' "${xvfb_run}" >> "${GITHUB_OUTPUT}"
