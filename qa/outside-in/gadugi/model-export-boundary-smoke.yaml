id: model-export-boundary-smoke
name: Model resource export boundary characterization smoke
description: >
  Gadugi-test wrapper for the alice-desktop model-export-boundary-smoke
  scenario. Runs ModelExportTest characterization checks via Maven to verify
  XML serialization, thumbnail generation, bounding-box metadata, and
  multi-resource round-trip fidelity for the model resource export boundary.
priority: HIGH
interface: CLI
agents:
  - name: maven-runner
    type: CLI
    config:
      executablePath: mvn
      workingDirectory: .
prerequisites:
  - Java 21 is available
  - Maven dependencies are available
  - The tweedle-lang submodule is initialized
tags:
  - model-export
  - command-smoke
  - pr-425
steps:
  - name: Run model export boundary characterization
    action: run
    agent: maven-runner
    params:
      command: mvn
      args:
        - -DincludeSims=false
        - -Dinstall4j.skip
        - -DfailIfNoTests=false
        - -Dsurefire.failIfNoSpecifiedTests=false
        - -pl
        - core/model-loading
        - -am
        - -Dtest=org.lgna.story.resourceutilities.ModelExportTest
        - test
    timeout: 600000
verifications:
  - type: exit-code
    target: process
    expected: "0"
    operator: equals
    description: Maven test run exits 0 confirming all ModelExportTest characterizations pass
estimatedDuration: 300
enabled: true
