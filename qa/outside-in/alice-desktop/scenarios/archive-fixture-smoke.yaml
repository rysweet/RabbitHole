id: alice-desktop-archive-fixture-smoke
name: Legacy player resource-recovery boundary smoke
title: Legacy player resource-recovery boundary smoke
workflow: archive-fixture-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - Generated legacy fixture and legacy player resource-recovery characterization tests are available in the checkout.
userActions:
  - Run the focused generated legacy fixture and legacy player resource-recovery boundary characterization smoke from the command line.
  - Exercise generated LFS-independent .a3p, .a3c, and .a3w archive boundaries, including JSON .a3w archives with manifest-declared image resources.
  - Confirm unsupported method calls, complex or mixed initializers, resource initializer binding gaps, unresolved parent cases, and unsupported manifest-declared program and sibling Tweedle types fail explicitly.
expectedOutcomes:
  - The generated legacy fixture boundary smoke command exits successfully when the gate is enabled and covers legacy player resource-recovery boundaries.
  - Generated JSON .a3c and .a3w fixtures report explicit decode failures for unsupported type boundaries.
  - Generated XML fallback .a3p fixtures write, read, and preserve resources through IoUtilities archive I/O.
  - Generated XML fallback .a3c fixtures write, read, and preserve type resources through IoUtilities archive I/O.
  - Simple supported .a3w fixtures export, read, re-export, and reread through IoUtilities with manifest-routed Tweedle source.
  - Generated JSON .a3w fixtures with unsupported resource initializers report explicit archive readback failures.
  - Supported generated JSON .a3w neighbors remain covered by the same focused characterization suite.
automation:
  cwd: .
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -DfailIfNoTests=false
    - -Dsurefire.failIfNoSpecifiedTests=false
    - -pl
    - core/story-api-migration
    - -am
    - -Dtest=org.lgna.project.io.HistoricalArchiveRoundTripCharacterizationTest
    - test
  timeoutSeconds: 600
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the generated legacy fixture and legacy player resource-recovery boundary smoke command.
    - Test output or surefire report naming HistoricalArchiveRoundTripCharacterizationTest.
fallback:
  mode: manual-evidence-required
  notes:
    - If the focused Maven smoke is unavailable, attach the nearest generated legacy fixture or legacy player resource-recovery characterization evidence.
    - Do not substitute GUI save/load evidence for this archive/player boundary.
supportingEvidence:
  - alice-desktop-tweedle-decoder-boundary-smoke
tags:
  - archive-fixture
  - command-smoke
  - archive-io
  - archive-player-boundary
steps:
  - validate
agents:
  - alice-desktop-qa
