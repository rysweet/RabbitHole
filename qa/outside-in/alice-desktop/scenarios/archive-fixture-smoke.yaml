id: alice-desktop-archive-fixture-smoke
title: Legacy player resource-recovery boundary smoke
workflow: archive-fixture-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - Historical archive round-trip characterization tests are available in the checkout.
userActions:
  - Run the focused legacy player resource-recovery boundary characterization smoke from the command line.
  - Exercise generated JSON .a3w archives with manifest-declared image resources.
  - Confirm unsupported manifest-declared program and sibling Tweedle types fail explicitly instead of producing partial resource-only readback.
expectedOutcomes:
  - The legacy player resource-recovery boundary smoke command exits successfully when the gate is enabled.
  - Generated JSON .a3w fixtures with unsupported resource initializers report explicit archive readback failures.
  - Supported generated JSON .a3w neighbors remain covered by the same focused characterization suite.
automation:
  cwd: .
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -DfailIfNoTests=false
    - -Dsurefire.failIfNoSpecifiedTests=false
    - -pl
    - core/story-api-migration
    - -am
    - -Dtest=org.lgna.project.io.HistoricalArchiveRoundTripCharacterizationTest
    - test
  timeoutSeconds: 600
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the legacy player resource-recovery boundary smoke command.
    - Test output or surefire report naming HistoricalArchiveRoundTripCharacterizationTest.
fallback:
  mode: manual-evidence-required
  notes:
    - If the focused Maven smoke is unavailable, attach the nearest legacy player resource-recovery characterization evidence.
    - Do not substitute GUI save/load evidence for this archive/player boundary.
supportingEvidence:
  - alice-desktop-tweedle-decoder-boundary-smoke
tags:
  - archive-fixture
  - command-smoke
  - archive-player-boundary
