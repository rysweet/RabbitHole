id: alice-desktop-tweedle-decoder-boundary-smoke
name: Tweedle decoder unsupported method-call boundary smoke
title: Tweedle decoder unsupported method-call boundary smoke
workflow: tweedle-decoder-boundary-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - Focused Tweedle encoder/decoder negative characterization tests are available in the checkout.
userActions:
  - Enable gated smokes in a workspace prepared for core AST module tests.
  - Run the focused unsupported adjacent method-call decoder command smoke.
  - Review the command output for explicit rejection of argument-bearing, unknown, duplicate, non-this, static, chained, and implicit calls.
expectedOutcomes:
  - Without the gate the scenario records a gated-not-run status and exits non-success unless --prepare-only is requested.
  - When the gate is enabled, focused unsupported method-call boundary checks exit successfully.
  - Command evidence confirms the decoder slice stays narrow and does not infer general method-call, member-access, constructor, or player decode support.
automation:
  cwd: .
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -DfailIfNoTests=false
    - -Dsurefire.failIfNoSpecifiedTests=false
    - -pl
    - core/ast
    - -am
    - -Dtest=org.alice.serialization.tweedle.TweedleEncoderDecoderTest#
    - test
  timeoutSeconds: 600
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the focused Tweedle decoder boundary smoke command.
    - Test output or surefire report naming zeroArgumentThisMethodCallDecodeRejectsArgumentBearingCall and adjacent rejection checks.
fallback:
  mode: manual-evidence-required
  notes:
    - If focused core AST tests are unavailable, attach the nearest decoder boundary characterization evidence and record the missing rejection.
    - Do not substitute desktop Save or Select Project proof for this decoder-specific smoke.
supportingEvidence:
  - alice-desktop-tweedle-decoder-this-call-smoke
tags:
  - immediate-qa-backlog
  - tweedle-decoder
  - command-smoke
steps:
  - validate
agents:
  - alice-desktop-qa
