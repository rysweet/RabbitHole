id: alice-desktop-story-api-generated-source-suite-smoke
title: Generated Story API source and runtime suite smoke
workflow: story-api-generated-source-suite-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - NetBeans generated Story API characterization tests are available in the checkout.
userActions:
  - Enable gated smokes in a workspace prepared for NetBeans generated-source tests.
  - Run the generated Story API source and headless runtime characterization suite.
  - Review the command output for generated Program and Scene source compilation plus headless listener and runtime-state characterizations.
expectedOutcomes:
  - Without the gate the scenario records a gated-not-run status and exits non-success unless --prepare-only is requested.
  - When the gate is enabled, the generated Story API characterization suite exits successfully.
  - Generated source compilation and headless runtime-adjacent characterizations remain compatible with the branch without claiming visible rendering or full world playback.
automation:
  cwd: .
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -DfailIfNoTests=false
    - -Dsurefire.failIfNoSpecifiedTests=false
    - -pl
    - netbeans
    - -am
    - -Dtest=org.alice.netbeans.project.ProjectCodeGeneratorStoryApiGeneratedSourceTest
    - test
  timeoutSeconds: 900
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the generated Story API source and runtime suite smoke command.
    - Test output naming ProjectCodeGeneratorStoryApiGeneratedSourceTest.
    - Notes identifying generated source compilation, headless listener dispatch, and headless runtime-state assertions reviewed.
fallback:
  mode: manual-evidence-required
  notes:
    - If the generated Story API suite is unavailable, attach the focused runtime smoke and any lower-level compile evidence that did run.
    - Manual GUI evidence should be added separately only for visible desktop workflows.
supportingEvidence:
  - alice-desktop-story-api-generated-runtime-smoke
  - alice-desktop-exported-project-smoke
tags:
  - immediate-qa-backlog
  - story-api
  - command-smoke
