id: alice-desktop-procedure-edit-seam-smoke
title: First lesson procedure edit seam smoke
workflow: procedure-edit-seam-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - Focused Eat Me procedure edit seam tests are available in the checkout.
userActions:
  - Enable gated smokes in a workspace prepared for core IDE module tests.
  - Run the focused procedure edit seam command smoke.
  - Review command evidence for a deterministic procedure edit artifact, command artifact, diff artifact, and precise UI-action blocker.
expectedOutcomes:
  - Without the gate the scenario records a gated-not-run status and exits non-success unless --prepare-only is requested.
  - When the gate is enabled, the focused procedure edit seam test exits successfully.
  - Command evidence covers only deterministic project/procedure edit artifacts plus the exact missing UI edit action target; it does not claim full lesson completion, grading, creative assessment, Save completion, or visible rendering correctness.
automation:
  cwd: .
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -DfailIfNoTests=false
    - -Dsurefire.failIfNoSpecifiedTests=false
    - -pl
    - core/ide
    - -am
    - -Dtest=org.alice.tools.EatmeEditProcedureTest#editsSceneProcedureAndWritesEatmeProofArtifacts
    - test
  timeoutSeconds: 600
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the focused procedure edit seam smoke command.
    - Test output or surefire report naming editsSceneProcedureAndWritesEatmeProofArtifacts.
    - Procedure edit artifacts named by the focused test include procedure-edit.json, procedure-edit-command.json, procedure.diff.json, procedure-tab-selection.json, and procedure-ui-action-no-go.json.
fallback:
  mode: manual-evidence-required
  notes:
    - If focused core IDE tests are unavailable, attach the nearest deterministic procedure edit evidence and record the missing seam assertion.
    - Do not substitute active Save proof, model exporter/hotspot proof, Select Project PID proof, launcher/rendering proof, lesson completion, grading, or creative assessment evidence.
supportingEvidence:
  - alice-desktop-post-project-open-window-state
tags:
  - immediate-qa-backlog
  - first-lesson
  - procedure-edit
  - command-smoke
