id: alice-desktop-story-api-generated-runtime-smoke
title: Generated Story API headless runtime state smoke
workflow: story-api-generated-runtime-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - NetBeans generated Story API characterization tests are available in the checkout.
userActions:
  - Enable gated smokes in a workspace prepared for focused NetBeans module tests.
  - Run the focused generated Story API runtime-state characterization command.
  - Review the command output for generated Program compilation, headless loading, direct configureStory invocation, and simulation speed assertion.
expectedOutcomes:
  - Without the gate the scenario records a gated-not-run status and exits non-success unless --prepare-only is requested.
  - When the gate is enabled, the focused runtime-state characterization exits successfully.
  - Generated Program.java compiles, loads from the temporary output, invokes configureStory headlessly, and reports simulation speed 1.5 through SProgram state.
automation:
  cwd: .
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -DfailIfNoTests=false
    - -Dsurefire.failIfNoSpecifiedTests=false
    - -pl
    - netbeans
    - -am
    - -Dtest=org.alice.netbeans.project.ProjectCodeGeneratorStoryApiGeneratedSourceTest#generatedStoryApiSimulationSpeedCallUpdatesRuntimeStateHeadlessly
    - test
  timeoutSeconds: 600
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the focused generated Story API runtime-state smoke command.
    - Test output naming generatedStoryApiSimulationSpeedCallUpdatesRuntimeStateHeadlessly.
    - Notes confirming the smoke proves headless generated runtime state only, not visible rendering or full world playback.
fallback:
  mode: manual-evidence-required
  notes:
    - If focused NetBeans tests are unavailable, attach the nearest generated Story API source characterization output and record the missing runtime-state assertion.
    - Manual GUI evidence must not be substituted for this headless generated-runtime contract.
supportingEvidence:
  - alice-desktop-exported-project-smoke
tags:
  - immediate-qa-backlog
  - story-api
  - command-smoke
