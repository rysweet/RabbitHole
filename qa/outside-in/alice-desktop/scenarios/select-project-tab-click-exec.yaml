id: alice-desktop-select-project-tab-click-exec
name: Select and open Africa Full through Select Project with AT-SPI via exec:exec
title: Select and open Africa Full through Select Project with AT-SPI via exec:exec
workflow: select-project-tab-click-smoke
automationMode: xvfb-real-alice
targetStarter:
  displayName: Africa Full
  repositoryPath: core/resources/src/application/resources/starter-projects/AfricaFull.a3p
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - Controlled QA license acceptance is explicitly enabled with an isolated java.util.prefs.userRoot.
  - python3-pyatspi is installed (sudo apt-get install -y python3-pyatspi).
  - libatk-wrapper-java is installed at /usr/share/java/java-atk-wrapper.jar.
  - The AT-SPI2 accessibility bus is running for the current user session.
  - alice-ide/pom.xml declares the alice-ide-atk exec:exec execution with -Xbootclasspath/a:/usr/share/java/java-atk-wrapper.jar.
  - PR #272 has been merged, proving Java/Swing widgets are visible through AT-SPI with exec:exec + NO_AT_BRIDGE=1.
userActions:
  - Prepare core/resources/target/distribution, then start Alice using exec:exec@alice-ide-atk.
  - Launch with ALICE_QA_ACCEPT_LICENSES_FOR_TESTS=1 so first-run license dialogs are bypassed.
  - Wait for the Select Project chooser to become visible.
  - While Alice is still running, use tab-click-probe.py via pyatspi to enumerate the Select Project accessibility structure, record roles/counts with arbitrary UI text redacted, identify the Select Project tab controls, and activate the Starters context.
  - Locate Africa Full only in the active Starters context, record its safe AT-SPI role/name/states/actions/tree path and parent selection-interface availability, then use a supported target action or parent selection interface to prove target-specific selection.
  - Click OK/Open only after target-specific Africa Full selection evidence exists, then record either the opened target metadata and Select Project dismissal or a structured nextBlocker explaining the exact remaining automation gap.
expectedOutcomes:
  - The first-run license dialog is not observed after isolated test opt-in.
  - A Java window titled Select Project is visible after launch readiness; selectProjectWaitStatus=select-project-window-found confirms the window was specifically awaited before the inventory was collected.
  - tab-click-observation.json records status=observed.
  - tab-click-observation.json records toggleTabNodeCount=5 listing all five Select Project tab toggle buttons (Blank Slates, Starters, My Projects, Recent, File System) at depth=11 with their correct names. Alice's Select Project dialog uses toggle buttons (AT-SPI role="toggle button") rather than standard JTabbedPane page tabs.
  - tab-click-observation.json records tabClickAttempts for the Select Project tab controls and confirms the Starters context was activated before searching for Africa Full.
  - tab-click-observation.json records Starters-tab safety metadata showing the target search scope was the active Starters tab.
  - tab-click-observation.json records targetStarter.displayName="Africa Full" and targetStarter.repositoryPath="core/resources/src/application/resources/starter-projects/AfricaFull.a3p".
  - tab-click-observation.json records evidenceStatus=opened only when targetStarterObserved.name="Africa Full", targetStarterSelected=true, targetStarterOpenAttempted=true, openedStarter matches the Africa Full metadata, and projectOpenObserved=true with projectOpenDetail confirming the Select Project frame is no longer present in the AT-SPI tree.
  - If Africa Full cannot be selected/opened through AT-SPI, tab-click-observation.json records evidenceStatus=blocked or selected plus nextBlocker.observedAtspiState, nextBlocker.actionAttempted, nextBlocker.expectedNextAction, and nextBlocker.reasonProgressStopped.
  - The proof confirms only target-specific AT-SPI selection/open evidence for the committed Africa Full starter; it does not claim visible rendering, full project interaction, grading, or lesson completion.
automation:
  cwd: alice-ide
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -Dcheckstyle.skip
    - -DskipTests
    - compile
    - exec:exec@alice-ide-atk
  timeoutSeconds: 240
  readyWaitSeconds: 60
evidence:
  required:
    - root-directory-prep.json confirming org.alice.ide.rootDirectory resolves to core/resources/target/distribution.
    - license-acceptance.json recording the isolated java.util.prefs.userRoot state.
    - license-dialog.json recording not-observed.
    - x-window-inventory.json naming Alice-related visible X window title, class, process, and geometry; selectProjectWaitStatus=select-project-window-found confirms the Select Project window was specifically awaited.
    - select-project-window.json recording observed Select Project title/class/process/geometry.
    - tab-click-observation.json recording status=observed with toggleTabNodeCount=5 (Blank Slates, Starters, My Projects, Recent, File System), tabClickAttempts all success, targetStarter displayName Africa Full, targetStarter repositoryPath core/resources/src/application/resources/starter-projects/AfricaFull.a3p, and either evidenceStatus=opened with openedStarter matching Africa Full and projectOpenObserved=true or a structured nextBlocker explaining the exact AT-SPI blocker that prevented target-specific selection/open proof.
    - Screenshot of the Alice desktop state.
    - Environment summary with Java version, Maven version, and DISPLAY value.
fallback:
  mode: manual-evidence-required
  notes:
    - If the Select Project window is not visible within the readiness wait, the wait mechanism must be confirmed to include the new scenario ID (alice-desktop-select-project-tab-click-exec).
    - If tab nodes have only toggle-button role with empty names, record the exact AT-SPI property gap.
    - If targetStarter selection fails, record the target role/name/states/actions/tree path, parent selection-interface availability, attempted action, expected next action, and reason progress stopped.
    - Do not claim Africa Full opening unless tab-click-observation.json records openedStarter matching the Africa Full metadata, targetStarterSelected=true, targetStarterOpenAttempted=true, and projectOpenObserved=true.
supportingEvidence:
  - alice-desktop-select-project-atk-exec
  - alice-desktop-select-project-widget-introspection
  - alice-desktop-select-project-inventory
steps:
  - validate
agents:
  - alice-desktop-qa
