id: alice-desktop-project-io-smoke
title: Repository archive IO save, reopen, edit, save/reopen, and export smoke
workflow: project-io-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - Project archive seam characterization tests are available in the checkout.
userActions:
  - Run the focused repository-owned project archive IO seam smoke from the command line.
  - Create or use a synthetic Alice project fixture.
  - Save, reopen, edit project-owned data, save again, reopen again, and export through IoUtilities.
expectedOutcomes:
  - The repository archive IO seam smoke command exits successfully when the gate is enabled.
  - Saved project artifacts can be reopened by the current Alice project reader.
  - The reopened edited archive preserves the edited project data and readable manifest/export structure.
  - Coverage is limited to repository-owned archive read/write APIs, not desktop Save-menu behavior, Save dialog completion, or full UI automation.
automation:
  cwd: .
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -Dsurefire.failIfNoSpecifiedTests=false
    - -pl
    - core/story-api-migration
    - -am
    - -Dtest=org.lgna.project.io.IoUtilitiesTest
    - test
  timeoutSeconds: 600
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the repository-owned archive IO seam smoke command.
    - Test output or surefire report naming IoUtilitiesTest.savedProjectCanBeReopenedEditedSavedAgainReopenedAndExported.
    - Notes identifying the archive-seam save, reopen, edit, save again, reopen again, export, manifest, and export archive structure assertions reviewed.
    - Notes stating this smoke does not cover active desktop Save-menu behavior, desktop Save dialog completion, or full UI automation.
fallback:
  mode: manual-evidence-required
  notes:
    - If the focused Maven smoke is unavailable, attach the nearest characterization evidence for the repository-owned project archive IO seam.
    - Desktop Save-menu, Save dialog, and full UI automation evidence remain out of scope for this smoke.
tags:
  - immediate-qa-backlog
  - project-io
  - command-smoke
