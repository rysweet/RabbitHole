id: alice-desktop-run-debug
name: Run and debug-like execution behavior
title: Run and debug-like execution behavior
workflow: run-debug
automationMode: manual-evidence-required
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - A small Alice project with visible program behavior is available or can be created.
userActions:
  - Launch Alice.
  - Open or create a project with a visible run action.
  - Run the program.
  - Exercise the closest available debug-like behavior, such as fast-forward or statement-level execution, if exposed in the current UI.
  - Stop or close the running program.
expectedOutcomes:
  - The program starts from the Alice run controls.
  - Desktop Run reaches VM statement execution when opt-in execution evidence is enabled.
  - Desktop Run attaches the onscreen render target into the Run view hierarchy when opt-in render-affordance evidence is enabled.
  - The closest available debug-like control behaves consistently with the current Alice baseline.
  - The user can stop or return from execution without uncaught application errors.
evidence:
  required:
    - desktop-run-execution.json and desktop-run-runtime.log when opt-in desktop Run execution evidence is enabled.
    - desktop-run-render-affordance.json when opt-in desktop Run render-affordance evidence is enabled.
    - desktop-run-pixel-observation.json from the same opt-in desktop Run path, with status observed when screen capture can sample the Run render area or blocked with exact blocker details when it cannot.
    - desktop-run-status-summary.json from the same opt-in desktop Run path, naming artifact statuses, the pixel-observation status, the files to inspect next, and the behavior still not proven.
    - Screenshot or screen capture for manual workflow context, not pixel-correctness evidence.
    - Notes naming the run and debug-like controls exercised and whether any manual visual evidence was collected.
    - Launch or run log.
    - Saved a3p project used for the run.
    - review-notes.txt summarizing reviewed artifacts and the acceptance decision.
fallback:
  mode: manual-evidence-required
  notes:
    - Do not invent a conventional debugger requirement if Alice does not expose one.
    - Treat fast-forward or statement execution as debug-like coverage only when it is visible in the baseline UI.
    - Treat render-affordance evidence as structural Run-view attachment evidence only; use desktop-run-pixel-observation.json for screenshot or pixel sampling status, not for rendering-engine correctness evidence.
supportingEvidence:
  - alice-desktop-launch
steps:
  - validate
agents:
  - alice-desktop-qa
