id: alice-desktop-future-ui-smoke
name: Future UI startup smoke placeholder
title: Future UI startup smoke placeholder
workflow: future-ui-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - A controlled display environment such as Xvfb is available when the gate is enabled.
userActions:
  - Prepare a controlled display environment.
  - Execute the launch smoke through the existing runner when UI gating is enabled.
  - Review the first-window or startup-signal evidence.
expectedOutcomes:
  - Without the gate the scenario records a gated-not-run status and exits non-success unless --prepare-only is requested.
  - When the gate is enabled, the launch smoke produces startup evidence without uncaught startup failure.
  - Future Swing automation can replace this placeholder without changing the scenario catalog boundary.
automation:
  cwd: .
  argv:
    - qa/outside-in/alice-desktop/runners/run-scenario.sh
    - run
    - alice-desktop-launch
    - --timeout-seconds
    - "30"
    - --evidence-dir
    - qa/outside-in/alice-desktop/evidence/future-ui-launch
  timeoutSeconds: 180
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the delegated launch smoke when the gate is enabled.
    - Startup screenshot or stable first-window signal when real UI evidence is collected.
    - Manual fallback notes when no controlled display is available.
fallback:
  mode: manual-evidence-required
  notes:
    - This is intentionally a no-op unless explicitly gated on for an environment with display support.
    - Do not require real GUI execution in normal QA validation.
supportingEvidence:
  - alice-desktop-launch
tags:
  - immediate-qa-backlog
  - future-ui
  - gated-ui
steps:
  - validate
agents:
  - alice-desktop-qa
