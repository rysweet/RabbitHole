id: alice-desktop-menu-action-smoke
name: Desktop menu/action smoke
title: Desktop menu/action smoke
workflow: menu-action-smoke
automationMode: gated-command-smoke
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
  - Menu bar characterization tests are available in the checkout.
userActions:
  - Enable gated smokes in a workspace prepared for core IDE module tests.
  - Run the focused menu/action contract command smoke.
  - Review the command output for Alice desktop menu registration and controller lookup coverage.
expectedOutcomes:
  - Without the gate the scenario records a gated-not-run status and exits non-success unless --prepare-only is requested.
  - When the gate is enabled, the focused Alice menu bar contract test exits successfully.
  - Command evidence covers launch-adjacent desktop menu registration without making brittle display or manual JavaFX claims.
automation:
  cwd: .
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -Dsurefire.failIfNoSpecifiedTests=false
    - -pl
    - core/ide
    - -am
    - -Dtest=org.alice.ide.croquet.models.AliceMenuBarContractTest
    - test
  timeoutSeconds: 600
  readyWaitSeconds: 1
evidence:
  required:
    - status.txt recording the gated command outcome.
    - command.log from the focused Alice menu/action smoke command.
    - Test output or surefire report naming AliceMenuBarContractTest.
    - Notes connecting any later manual desktop pass to the same menu/action contract.
fallback:
  mode: manual-evidence-required
  notes:
    - If focused core IDE tests are unavailable, attach the nearest menu/action plumbing evidence and record the missing assertion.
    - Manual GUI evidence should be added only when a human actually exercises the desktop menu/action path.
supportingEvidence:
  - alice-desktop-launch
tags:
  - immediate-qa-backlog
  - menu-action
  - command-smoke
steps:
  - validate
agents:
  - alice-desktop-qa
