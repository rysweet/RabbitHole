id: alice-desktop-launch
name: Launch Alice desktop
title: Launch Alice desktop
workflow: launch
automationMode: xvfb-real-alice
preconditions:
  - Java 21 is available.
  - Maven dependencies are available.
  - The tweedle-lang submodule is initialized.
userActions:
  - Prepare core/resources/target/distribution, then start Alice using the Maven launch path that compiles alice-ide classes before exec:java.
  - Wait for the main desktop window to become visible.
  - Confirm the first visible shell is ready for creating or opening a project.
expectedOutcomes:
  - Alice starts without the org.alice.stageide.EntryPoint ClassNotFoundException.
  - The desktop shell is visible and ready for project interaction.
  - The captured evidence is sufficient to distinguish a usable desktop from a splash-only or crashed startup.
automation:
  cwd: alice-ide
  argv:
    - mvn
    - -DincludeSims=false
    - -Dinstall4j.skip
    - -Dcheckstyle.skip
    - -DskipTests
    - compile
    - exec:java
    - -Dalice-ide
  timeoutSeconds: 180
  readyWaitSeconds: 60
evidence:
  required:
    - root-directory-prep.json confirming org.alice.ide.rootDirectory resolves to core/resources/target/distribution, or naming the exact missing distribution/Maven phase blocker.
    - Launch log containing Alice startup output.
    - Screenshot of the Alice desktop window or first ready project shell.
    - x-window-inventory.json naming Alice-related visible X window title, class, process, and geometry after launch readiness wait.
    - application-root-error.json when a Java window titled Application Root Error appears before the Alice desktop.
    - license-dialog.json naming the exact first-run License Agreement title/controls when that dialog blocks project interaction, or not-observed when absent.
    - license-acceptance.json naming the isolated java.util.prefs.userRoot state used only when ALICE_QA_ACCEPT_LICENSES_FOR_TESTS=1 is explicitly set.
    - controlled-display-pixel-observation.json naming observed controlled-display pixels or the exact display/Xvfb blocker.
    - Exit, status, or timeout record.
    - Environment summary with Java version, Maven version, and DISPLAY value.
    - Notes identifying whether the screenshot shows a ready desktop, project chooser, or fallback failure state.
fallback:
  mode: manual-evidence-required
  notes:
    - If Xvfb or renderer initialization fails in the current environment, preserve the failure log.
    - Provide a manual launch screenshot from a supported desktop environment when automated launch evidence cannot be collected.
steps:
  - validate
agents:
  - alice-desktop-qa
