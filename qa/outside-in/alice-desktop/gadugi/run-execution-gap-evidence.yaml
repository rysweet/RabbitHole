name: run-execution-gap-evidence
description: "Validates PR #404 bounded Run-window execution gap evidence wiring and deterministic world-advance blocker contract through existing QA entry points only; it does not validate full world execution, visible rendering correctness, playback, full UI automation, Save completion, grading, Sims validation, deployed installer success, or lesson completion."
config:
  timeout: 180000
environment:
  requires: []
agents:
  - id: alice-desktop-qa-cli
    type: cli
    config:
      workingDirectory: .
metadata:
  priority: medium
  tags:
    - cli
    - gadugi
    - pr-404
    - desktop-run-debug
    - execution-gap-evidence
steps:
  - name: validate-desktop-outside-in-catalog
    action: run
    params:
      command: qa/outside-in/alice-desktop/runners/validate-scenarios.sh
    timeout: 60000
  - name: prepare-run-debug-execution-gap-evidence
    action: run
    params:
      command: qa/outside-in/alice-desktop/runners/run-scenario.sh
      args:
        - run
        - alice-desktop-run-debug
        - --prepare-only
        - --evidence-dir
        - qa/outside-in/alice-desktop/evidence/gadugi-run-execution-gap
    timeout: 60000
  - name: run-desktop-outside-in-contract-tests
    action: run
    params:
      command: qa/outside-in/alice-desktop/tests/run-tests.sh
    timeout: 120000
assertions: []
