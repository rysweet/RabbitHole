name: window-menu-registration-evidence
description: "Validates PR #401 Window menu model registration characterization contract through existing QA entry points only; it does not validate visible rendering, rendered pixels, visible desktop windows, JavaFX scene-graph layout, full lesson completion, or the full Alice desktop workflow."
config:
  timeout: 180000
environment:
  requires: []
agents:
  - id: alice-desktop-qa-cli
    type: cli
    config:
      workingDirectory: .
metadata:
  priority: medium
  tags:
    - cli
    - gadugi
    - pr-401
    - menu-action
    - window-menu-registration-evidence
steps:
  - name: validate-desktop-outside-in-catalog
    action: run
    params:
      command: qa/outside-in/alice-desktop/runners/validate-scenarios.sh
    timeout: 60000
  - name: prepare-window-menu-registration-evidence
    action: run
    params:
      command: qa/outside-in/alice-desktop/runners/run-scenario.sh
      args:
        - run
        - alice-desktop-menu-action-smoke
        - --prepare-only
        - --evidence-dir
        - qa/outside-in/alice-desktop/evidence/gadugi-window-menu-registration
    timeout: 60000
  - name: run-desktop-outside-in-contract-tests
    action: run
    params:
      command: qa/outside-in/alice-desktop/tests/run-tests.sh
    timeout: 120000
assertions: []
