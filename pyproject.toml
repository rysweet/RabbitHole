[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alice3-modernization-qa"
version = "0.16.0"
description = "Alice 3 outside-in QA command wrapper."
requires-python = ">=3.9"

[project.scripts]
alice-qa = "alice_qa:main"

[tool.setuptools]
py-modules = ["alice_qa"]
