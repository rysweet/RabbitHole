site_name: Alice 3 Modernization
site_description: Modernizing the Alice 3 educational programming environment
repo_url: https://github.com/rysweet/RabbitHole
docs_dir: docs
strict: true
theme:
  name: material
  palette:
    primary: blue
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links:
    not_found: warn
